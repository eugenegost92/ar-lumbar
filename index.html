<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>AR «Люмбальная пункция» — v2</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, sans-serif;
    }

    body > video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      background: #000 !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    canvas, canvas.a-canvas {
      background: transparent !important;
    }

    .a-enter-vr,
    .a-enter-vr-button,
    .a-enter-ar,
    .a-orientation-modal {
      display: none !important;
    }

    #status {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(90vw, 620px);
      box-sizing: border-box;
      padding: 11px 15px;
      border-radius: 14px;
      background: rgba(0,0,0,.55);
      color: #fff;
      text-align: center;
      font-size: 15px;
      line-height: 1.35;
      transition: opacity .25s ease;
      pointer-events: none;
    }

    #version {
      position: fixed;
      z-index: 1001;
      top: 10px;
      right: 10px;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,.5);
      color: #fff;
      font: 12px/1 Arial, sans-serif;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="version">Lumbar AR v2</div>
  <div id="status">Запускаю камеру…</div>

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiScanning: no;
      uiLoading: yes;
      uiError: yes;
      filterMinCF: 0.0005;
      filterBeta: 10;
      warmupTolerance: 3;
      missTolerance: 10;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets timeout="30000">
      <a-asset-item id="simModel" src="./lumbar.glb"></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      camera="near: 0.01; far: 1000">
    </a-camera>

    <a-light type="ambient" intensity="1.8"></a-light>
    <a-light type="hemisphere"
             color="#ffffff"
             groundColor="#888888"
             intensity="1.1"
             position="0 1 0">
    </a-light>
    <a-light type="directional"
             color="#ffffff"
             intensity="1.8"
             position="-1 2 3">
    </a-light>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!--
        ВАЖНО:
        исходная фотограмметрическая модель находится далеко от своего нуля:
        примерно X=-18.3, Y=-15.6, Z=12.45.
        Поэтому мы сначала возвращаем сам mesh к локальному нулю,
        а уже затем поворачиваем и масштабируем всю модель.

        После этого нижняя точка модели лежит на плоскости карточки.
      -->
      <a-entity
        id="modelPivot"
        position="0 0 0"
        rotation="90 0 0"
        scale="1.4 1.4 1.4">

        <a-gltf-model
          id="simulator"
          src="#simModel"
          position="18.304993 15.766948 -12.455071"
          rotation="0 0 0">
        </a-gltf-model>

      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('#scene');
    const target = document.querySelector('#target');
    const simulator = document.querySelector('#simulator');
    const status = document.querySelector('#status');

    function forceCameraBehindAR() {
      const video = document.querySelector('body > video');
      if (video) {
        video.style.setProperty('z-index', '0', 'important');
        video.style.setProperty('position', 'fixed', 'important');
        video.style.setProperty('object-fit', 'cover', 'important');
      }

      if (scene && scene.canvas) {
        scene.canvas.style.setProperty('background', 'transparent', 'important');
      }
    }

    simulator.addEventListener('model-loaded', () => {
      status.style.opacity = '1';
      status.textContent = '3D-модель загружена. Наведите камеру на карточку.';
      console.log('Lumbar GLB loaded');
    });

    simulator.addEventListener('model-error', (event) => {
      status.style.opacity = '1';
      status.textContent = 'Ошибка загрузки 3D-модели. Проверьте lumbar.glb и два файла текстур.';
      console.error('GLB model error', event.detail);
    });

    scene.addEventListener('renderstart', () => {
      forceCameraBehindAR();
      if (scene.renderer) {
        scene.renderer.toneMappingExposure = 1.15;
      }
    });

    scene.addEventListener('arReady', () => {
      forceCameraBehindAR();
      status.style.opacity = '1';
      status.textContent = 'Камера готова. Наведите её на карточку симулятора.';
    });

    scene.addEventListener('arError', () => {
      status.style.opacity = '1';
      status.textContent = 'Не удалось запустить камеру. Проверьте разрешение камеры в браузере.';
    });

    target.addEventListener('targetFound', () => {
      forceCameraBehindAR();
      status.textContent = 'Карточка найдена.';
      setTimeout(() => {
        status.style.opacity = '0';
      }, 650);
    });

    target.addEventListener('targetLost', () => {
      status.style.opacity = '1';
      status.textContent = 'Карточка потеряна. Наведите камеру на карточку ещё раз.';
    });

    let checks = 0;
    const timer = setInterval(() => {
      forceCameraBehindAR();
      checks++;
      if (checks > 30) clearInterval(timer);
    }, 250);
  </script>
</body>
</html>
